<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Karbon Assure — Soil Health Edge Node{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
  <header class="ka-header">
    <a class="ka-brand" href="{{ url_for('index') }}">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Karbon Assure" class="ka-logo">
      <span>Karbon Assure <em>Soil Health Edge Node</em></span>
    </a>
    <nav class="ka-nav">
      <a href="{{ url_for('raw_page') }}">Raw Stream</a>
      <a href="{{ url_for('inference_page') }}">Inference</a>
      <a href="/api/download/csv" class="ka-nav-download" id="ka-download-all-btn" title="Download all sensor readings as CSV">⬇ Download CSV</a>
    </nav>
  </header>
  <main class="ka-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="ka-footer">Karbon Assure Edge Node · Pot A (BME688 @0x76 · BH1750 @0x23 · Soil A1) · Pot B (BME688 @0x77 · BH1750 @0x5C · Soil A0) · Wire1/Qwiic · 1 Hz live</footer>
</body>
</html>
